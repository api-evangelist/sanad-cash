name: Sanad Cash
description: >-
  Sanad Cash was a Saudi Arabia-based fintech startup that operated an on-demand
  payment platform, giving employees early access to earned wages and providing
  employers with tools to manage on-demand pay. The company raised a $1.6M seed
  round in January 2022 with participation from Impact46 and was backed by 500
  Global. Sanad Cash was acquired by HyperPay in July 2023, and the Sanad Cash
  business was subsequently acquired by Qashio in October 2025. The independent
  sanadcash.com property is no longer reachable (no live HTTPS service), so this
  profile documents the company's identity and residual domain footprint rather
  than a live developer/API surface.
